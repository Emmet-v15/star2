# Not a standalone file: this location block lives inside the existing
# star.v15.studio server block in /etc/nginx/conf.d/star.v15.studio.conf,
# so star2 reuses v1's TLS certificate instead of needing its own.
#
# Backup of the pre-star2 file: /etc/nginx/conf.d/star.v15.studio.conf.bak-star2
# Always `sudo nginx -t` before reloading - that vhost also serves star v1.

    # star2 signal plane (P2P rendezvous only; media is direct UDP peer-to-peer).
    # The trailing slash on proxy_pass strips the /star2 prefix, so the signal
    # server sees "/" and needs no route awareness.
    location /star2 {
        proxy_pass http://127.0.0.1:9101/;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        # Signalling connections idle for the whole call; don't reap them.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
