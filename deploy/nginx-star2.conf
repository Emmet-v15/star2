# Not a standalone file: these blocks live inside the existing star.v15.studio
# server block in /etc/nginx/conf.d/star.v15.studio.conf, so star2 reuses v1's
# TLS certificate instead of needing its own.
#
# Backup of the pre-star2 file: /etc/nginx/conf.d/star.v15.studio.conf.bak-star2
# Always `sudo nginx -t` before reloading - that vhost also serves star v1.

    # star2 signal plane (introductions only; media is direct UDP peer-to-peer).
    # Exact match: /star2 -> / (the signalling WebSocket).
    location = /star2 {
        proxy_pass http://127.0.0.1:9101/;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        # Rendezvous connections idle for the whole call; do not reap them.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Children: /star2/updates -> /updates. This MUST be a separate block with the
    # trailing slash - "location /star2" would rewrite /star2/updates to //updates.
    location /star2/ {
        proxy_pass http://127.0.0.1:9101/;
        include /etc/nginx/conf.d/includes/proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The browser guest owns the root; deploy/publish-guest.sh fills this directory.
    # no-cache forces revalidation, so a publish reaches an open tab on reload
    # instead of whenever the browser feels like asking.
    root /var/www/star.v15.studio;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
