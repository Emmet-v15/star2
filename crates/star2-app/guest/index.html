<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>star2 guest</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0c0e; color: #e5e5e5;
    font: 14px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  .panel {
    width: min(420px, 92vw); border: 1px solid #23262b; border-radius: 10px;
    background: #141619; padding: 18px; display: grid; gap: 10px;
  }
  .brand { font-weight: bold; letter-spacing: .2em; color: #3ea6ff; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; background: #0e1013; border: 1px solid #23262b; border-radius: 5px;
    color: inherit; font: inherit; padding: 6px 8px; outline: none;
  }
  input:focus { border-color: #3ea6ff; }
  button {
    background: #1b1e22; border: 1px solid #23262b; border-radius: 5px;
    color: inherit; font: inherit; padding: 6px 14px; cursor: pointer;
  }
  button:hover { border-color: #3ea6ff; }
  #status { color: #7c828c; min-height: 1.5em; white-space: pre-wrap; user-select: text; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3a3e45; margin-right: 6px; }
  .dot.live { background: #39d98a; box-shadow: 0 0 6px #39d98a; }
  .dot.bad { background: #d96b6b; }
  .hint { font-size: 12px; color: #7c828c; user-select: text; }
</style>
</head>
<body>
<div class="panel">
  <div class="brand">STAR2 · guest</div>
  <div class="row">
    <input id="room" placeholder="room token" spellcheck="false" autocomplete="off" />
    <button id="join">Join</button>
    <button id="leave" hidden>Leave</button>
  </div>
  <div class="hint">WebRTC data channel → star-proto media. Needs Chrome/Edge, or Firefox 130+.</div>
  <div id="status"><span class="dot"></span>idle</div>
</div>
<script src="guest.js"></script>
</body>
</html>
