[package]
name = "star2-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "star2"
path = "src/main.rs"

[features]
# Serves the bundled ui/dist instead of build.devUrl. Without it the window
# loads http://localhost:5173, which only works where a dev server happens to
# run. cargo tauri dev stays on the dev server because the feature is off by
# default; release builds pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
star-voice = { workspace = true }
star-proto = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tauri = { version = "2", features = [] }

# std has no hostname API, and the engine wants a sensible default display name.
gethostname = "1"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
