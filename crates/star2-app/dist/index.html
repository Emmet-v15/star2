<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>star2</title>
<style>
  :root { --bg:#0b0c0e; --panel:#141619; --line:#23262b; --txt:#d7dbe0; --dim:#7c828c;
          --accent:#3ea6ff; --ok:#39d98a; --warn:#d9b45b; --bad:#d96b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column;
    font:13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; -webkit-user-select:none;
  }
  #bar { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel);
         border-bottom:1px solid var(--line); }
  #bar .brand { font-weight:700; letter-spacing:1px; color:var(--accent); }
  input { background:#0e1013; color:var(--txt); border:1px solid var(--line); border-radius:4px;
          padding:5px 7px; font:inherit; flex:1; min-width:0; user-select:text; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:#1b1e22; color:var(--txt); border:1px solid var(--line); border-radius:4px;
           padding:5px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .lbl { color:var(--dim); }
  #status { display:flex; align-items:center; gap:6px; color:var(--dim); margin-left:auto; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  #dot.connecting { background:var(--warn); }
  #dot.live { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  #dot.down { background:var(--bad); }

  #stage { flex:1; padding:10px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }

  /* In-call header card: room code + actions */
  #callcard { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  #calltop { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  #calltop .who { color:var(--dim); }
  #code { flex:1; font-size:15px; font-weight:700; letter-spacing:.5px; color:#fff; user-select:text;
          white-space:nowrap; overflow-x:auto; padding:3px 2px; }

  /* Telemetry panel: a stack of thin bar-gauges (label · bar · value), star-style */
  #tele { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;
          display:flex; flex-direction:column; gap:5px; }
  #tele .hd { color:var(--dim); letter-spacing:.5px; font-size:11px; margin-bottom:2px; }
  .g { display:grid; grid-template-columns:34px 1fr 64px; align-items:center; gap:8px; }
  .gl { color:#8093a6; letter-spacing:.5px; font-size:11px; }
  .gb { height:4px; border-radius:2px; background:rgba(255,255,255,.13); overflow:hidden; }
  .gb > i { display:block; height:100%; width:0%; background:var(--accent);
            border-radius:2px; transition:width .25s linear, background-color .2s; }
  .gv { color:#b9c6d4; text-align:right; opacity:.85; font-variant-numeric:tabular-nums; font-size:12px; }

  #fatal { color:var(--bad); white-space:pre-wrap; user-select:text; }
  details summary { cursor:pointer; color:var(--dim); font-size:11px; letter-spacing:.5px; }
  #log { margin-top:6px; max-height:150px; overflow-y:auto; background:#0e1013;
         border:1px solid var(--line); border-radius:6px; padding:8px 10px;
         font-size:11px; line-height:1.5; color:#7d85a8; white-space:pre-wrap; user-select:text; }
</style>
</head>
<body>
  <div id="bar">
    <span class="brand">STAR2</span>
    <span id="joinGroup" style="display:flex; gap:8px; flex:1;">
      <input id="room" placeholder="room token (blank = new room)" spellcheck="false" autocomplete="off" />
      <button id="go">Join</button>
    </span>
    <span id="inCallGroup" style="display:none; gap:8px; flex:1; align-items:center;">
      <button id="leave">Leave</button>
      <input id="code" readonly title="room token — share it" />
      <button id="copy">Copy</button>
    </span>
    <div id="status"><span id="dot"></span><span id="stext">idle</span></div>
  </div>

  <div id="stage">
    <div id="tele" style="display:none">
      <div class="hd">TELEMETRY</div>
    </div>
    <div id="fatal"></div>
    <details>
      <summary>ENGINE LOG</summary>
      <div id="log"></div>
    </details>
  </div>

<script>
const T = window.__TAURI__ || null;
const invoke = (cmd, args) => (T ? T.core.invoke(cmd, args) : Promise.reject("no tauri"));
const listen = T && T.event ? T.event.listen.bind(T.event) : () => {};
const $ = (id) => document.getElementById(id);

// One phase drives every pixel. Events mutate phase; render() applies it.
let phase = "idle";            // idle | connecting | live | down
let stats = null;

function setPhase(p) {
  phase = p;
  $("joinGroup").style.display    = p === "idle" || p === "down" ? "flex" : "none";
  $("inCallGroup").style.display  = p === "connecting" || p === "live" ? "flex" : "none";
  $("tele").style.display         = p === "connecting" || p === "live" ? "flex" : "none";
  if (p !== "live") $("stext").textContent = { idle:"idle", connecting:"connecting…", down:"error" }[p] || p;
  if (p === "down") { $("dot").className = "down"; return; }
  $("dot").className = { idle:"", connecting:"connecting", live:"live" }[p] || "";
}

// Gauge rows, lazily created and updated in place (label · bar · value).
const OK = "#7ecfa0", WARN = "#d9b45b", BAD = "#d96b6b", NEUTRAL = "#5fa8d3";
const health = (v, warn, bad) => v >= bad ? BAD : v >= warn ? WARN : OK;

function setGauge(key, label, frac, color, text) {
  const tele = $("tele");
  let row = tele.querySelector('.g[data-k="' + key + '"]');
  if (!row) {
    row = document.createElement("div"); row.className = "g"; row.dataset.k = key;
    row.innerHTML = '<span class="gl"></span><span class="gb"><i></i></span><span class="gv"></span>';
    row.querySelector(".gl").textContent = label;
    tele.appendChild(row);
  }
  const fill = row.querySelector(".gb > i");
  fill.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(0) + "%";
  fill.style.backgroundColor = color;
  row.querySelector(".gv").textContent = text;
}
const dropGauge = (key) => $("tele").querySelector('.g[data-k="' + key + '"]')?.remove();

function renderStats(s) {
  // Mic level, -60..0 dBFS.
  const db = s.mic_db <= -99 ? -Infinity : s.mic_db;
  setGauge("lvl", "LVL", (db + 60) / 60,
           db >= -1 ? BAD : db >= -6 ? WARN : OK,
           db === -Infinity ? "−∞" : db.toFixed(0) + "dB");
  // Send rate.
  setGauge("net", "NET", Math.min(1, s.tx_pps / 200), NEUTRAL, s.tx_pps + "/s");
  // Receive path.
  if (s.rx_pps > 0) {
    setGauge("jit", "JIT", Math.min(1, s.jitter_ms / 50), health(s.jitter_ms, 20, 40), s.jitter_ms.toFixed(0) + "ms");
    setGauge("buf", "BUF", Math.min(1, s.target_ms / 120), NEUTRAL, s.target_ms.toFixed(0) + "ms");
    setGauge("loss", "LOSS", Math.min(1, s.loss_pct / 5), health(s.loss_pct, 0.5, 2), s.loss_pct.toFixed(1) + "%");
    setGauge("out", "OUT", Math.min(1, s.out_ms / 60),
             s.out_ms < 5 ? BAD : s.out_ms < 10 ? WARN : OK,
             s.out_ms.toFixed(0) + "ms");
    setGauge("play", "PLAY", Math.min(1, s.play_fps / 210), NEUTRAL, s.play_fps + "/s");
  } else {
    for (const k of ["jit","buf","loss","out","play"]) dropGauge(k);
  }
  // Direct-path RTT: only shown once the punch probe has measured it.
  if (s.rtt_ms > 0) setGauge("rtt", "RTT", Math.min(1, s.rtt_ms / 300), health(s.rtt_ms, 80, 160), s.rtt_ms.toFixed(0) + "ms");
  else dropGauge("rtt");
  // Media path.
  const pv = s.path === "direct" ? 1 : s.path === "punching" ? 0.5 : 0.1;
  setGauge("p2p", "P2P", pv,
           s.path === "direct" ? OK : s.path === "punching" ? WARN : NEUTRAL,
           s.path);
}

$("go").onclick = async () => {
  $("go").disabled = true;
  try {
    const token = await invoke("join", { room: $("room").value });
    if (!token) throw new Error("engine returned no room token");
    $("code").value = token;
    localStorage.setItem("star2.room", token);
    setPhase("connecting");
  } catch (e) {
    $("fatal").textContent = String(e);
    setPhase("down");
  }
  $("go").disabled = false;
};
$("room").addEventListener("keydown", (ev) => { if (ev.key === "Enter") $("go").click(); });

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("code").value); } catch (_) {}
  $("copy").textContent = "Copied";
  setTimeout(() => $("copy").textContent = "Copy", 1100);
};

$("leave").onclick = async () => {
  try { await invoke("leave"); } catch (_) {}
  $("fatal").textContent = "";
  setPhase("idle");
};

function appendLog(line) {
  const el = $("log");
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
  el.textContent += (el.textContent ? "\n" : "") + line;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

if (T && T.event) {
  listen("engine", (ev) => {
    const m = ev.payload;
    switch (m.t) {
      case "room_joined":
        $("code").value = m.room;
        localStorage.setItem("star2.room", m.room);
        if (phase !== "live") setPhase("connecting");
        break;
      case "direct":
        $("stext").textContent = `connected · ${m.peer}`;
        setPhase("live");
        break;
      case "status":
        if (/^idle/.test(m.text)) { $("fatal").textContent = ""; setPhase("idle"); }
        else if (phase === "connecting" || phase === "live") $("stext").textContent = m.text;
        else $("stext").textContent = m.text;
        break;
      case "ended":
        $("fatal").textContent = m.why;
        setPhase("down");
        break;
      case "stats":
        stats = m;
        renderStats(m);
        break;
      case "log":
        appendLog(m.line);
        break;
    }
  });
}

const last = localStorage.getItem("star2.room");
if (last) { $("room").value = last; $("code").value = last; }
setPhase("idle");
</script>
</body>
</html>
