[package]
name = "star2-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "star2_engine"
path = "src/lib.rs"

[dependencies]
star2-proto = { workspace = true }
cpal = "0.15"
audiopus = "0.2"
getrandom = "0.3"
ringbuf = "0.4"
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Non-Windows: plain IP_TOS works, so socket2 is all we need for DSCP.
[target.'cfg(not(windows))'.dependencies]
socket2 = "0.5"

# Windows needs the `windows` crate twice over:
#   Win32_Media                    - timeBeginPeriod (timer granularity)
#   Win32_NetworkManagement_QoS    - qWAVE, the ONLY way to set DSCP on Windows
#                                    (setsockopt(IP_TOS) is ignored since XP SP2)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media",
    "Win32_Foundation",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
] }
