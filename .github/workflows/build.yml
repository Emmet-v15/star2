name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build client
        run: cargo build --release -p star2-cli

      - name: Test
        run: cargo test --release

      # Releases, not upload-artifact: Actions artifact storage is quota-limited
      # on a private repo and uploads fail there long before the build does.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp target/release/star2.exe out/star2-windows-x64.exe
          ls -la out

      - name: Publish to dev-builds release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds out/* --clobber

  macos:
    # This project owns no darwin hardware, so these builds are the only compile
    # proof macOS gets. Both client targets ship to dev-builds; the rest of the
    # workspace builds for compile coverage only (the relay deploys on Linux).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # audiopus_sys builds its vendored Opus with autotools on unix and never
      # hears about cargo's target triple, so the toolchain comes from brew and
      # the Intel leg is steered through clang -arch (Rosetta runs configure's
      # test programs).
      - name: Install Opus build prerequisites
        run: brew install autoconf automake libtool

      - name: Test (native arm64)
        run: cargo test --release

      - name: Build workspace (Apple silicon)
        run: cargo build --release --workspace --target aarch64-apple-darwin

      - name: Build workspace (Intel)
        env:
          CC: clang -arch x86_64
        run: cargo build --release --workspace --target x86_64-apple-darwin

      # Releases, not upload-artifact: same Actions-quota reasoning as above.
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/star2 out/star2-macos-aarch64
          cp target/x86_64-apple-darwin/release/star2 out/star2-macos-x64
          ls -la out

      - name: Publish to dev-builds release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds out/* --clobber

  rendezvous:
    # The rendezvous server is pure Rust (no C deps), so it cross-compiles to the
    # aarch64 relay box straight from Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo install cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
      - run: cargo zigbuild -p star2-rendezvous --release --target aarch64-unknown-linux-gnu.2.34
      - name: Publish rendezvous to dev-builds release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/aarch64-unknown-linux-gnu/release/star2-rendezvous star2-rendezvous-aarch64
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds star2-rendezvous-aarch64 --clobber
