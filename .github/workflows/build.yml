name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # audiopus_sys compiles libopus from source, which needs autotools. Windows
      # uses the MSVC path and doesn't. cpal itself needs nothing extra here:
      # CoreAudio and WASAPI are system frameworks.
      - name: Autotools (audiopus_sys builds libopus from source)
        if: runner.os == 'macOS'
        run: brew install -q autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libopus is built for the host arch, so each runner produces a native
      # binary - macos-latest is Apple Silicon, macos-13 is Intel.
      - name: Build client
        run: cargo build --release -p star2-cli -p star2-updater

      - name: Test
        run: cargo test --release -p star2-proto -p star2-engine

      # Releases, not upload-artifact: Actions artifact storage is quota-limited
      # on a private repo and uploads fail there long before the build does.
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p out
          for b in star2 star2-engine; do
            for f in "target/release/$b" "target/release/$b.exe"; do
              [ -f "$f" ] || continue
              ext=""; case "$f" in *.exe) ext=".exe";; esac
              cp "$f" "out/${b}-${{ matrix.name }}${ext}"
            done
          done
          ls -la out

      - name: Publish to dev-builds release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds out/* --clobber

  signal:
    # The signal server is pure Rust (no C deps), so it cross-compiles to the
    # aarch64 relay box straight from Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo install cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
      - run: cargo zigbuild -p star2-signal --release --target aarch64-unknown-linux-gnu.2.34
      - name: Publish signal to dev-builds release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/aarch64-unknown-linux-gnu/release/star2-signal star2-signal-aarch64
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds star2-signal-aarch64 --clobber
