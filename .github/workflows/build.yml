name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# star2's crates are path dependencies on ../star-libs, so every job checks out
# both repositories side by side and runs cargo from inside star2. star-libs is
# private; STAR_LIBS_SSH_KEY is the private half of a read-only deploy key
# registered on it, which is why no PAT is involved.
jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: star2
      - uses: actions/checkout@v4
        with:
          repository: Emmet-v15/star-libs
          path: star-libs
          ssh-key: ${{ secrets.STAR_LIBS_SSH_KEY }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: star2

      - name: Build client
        working-directory: star2
        run: cargo build --release -p star2-app

      - name: Test
        working-directory: star2
        run: cargo test --release

      # Releases, not upload-artifact: Actions artifact storage is quota-limited
      # on a private repo and uploads fail there long before the build does.
      - name: Stage binary
        shell: bash
        working-directory: star2
        run: |
          mkdir -p out
          cp target/release/star2.exe out/star2-windows-x64.exe
          ls -la out

      # gh reads the repository from the git remote in the working directory, so
      # this has to run inside star2 or it would target star-libs.
      - name: Publish to dev-builds release
        shell: bash
        working-directory: star2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds out/* --clobber

  rendezvous:
    # The rendezvous server is pure Rust (no C deps), so it cross-compiles to the
    # aarch64 relay box straight from Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: star2
      - uses: actions/checkout@v4
        with:
          repository: Emmet-v15/star-libs
          path: star-libs
          ssh-key: ${{ secrets.STAR_LIBS_SSH_KEY }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: star2
      - run: rustup target add aarch64-unknown-linux-gnu
      - run: cargo install cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
      - working-directory: star2
        run: cargo zigbuild -p star2-rendezvous --release --target aarch64-unknown-linux-gnu.2.34
      - name: Publish rendezvous to dev-builds release
        working-directory: star2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/aarch64-unknown-linux-gnu/release/star2-rendezvous star2-rendezvous-aarch64
          gh release view dev-builds >/dev/null 2>&1 ||             gh release create dev-builds --title "dev builds" --notes "latest CI binaries" --prerelease
          gh release upload dev-builds star2-rendezvous-aarch64 --clobber
