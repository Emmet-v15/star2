[workspace]
resolver = "2"
members = ["crates/star2-rendezvous", "crates/star2-app"]
exclude = ["scratch"]

[workspace.package]
edition = "2021"
version = "0.4.6"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
star-proto = { path = "../star-libs/crates/star-proto" }
star-voice = { path = "../star-libs/crates/star-voice" }

# The rendezvous server runs on a small loaded aarch64 box: optimize for size.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Keep the audio DSP usable in debug builds while staying quick to recompile.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
